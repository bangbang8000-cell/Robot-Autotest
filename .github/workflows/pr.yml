name: PR

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

# 同一分支的重复推送取消旧流水线，省 runner
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_NAME: robot_it
  DB_USERNAME: robot
  # 口令走仓库 Secret（Settings → Secrets and variables → Actions → DB_PASSWORD），仓库里不落明文（FR-v0.1-07）
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, linux, x64, rf-lab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint

  test:
    name: test
    needs: lint
    runs-on: [self-hosted, linux, x64, rf-lab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 脏库会让偶发失败变成常态（DEV-PLAN §5 必守点 2）
      - run: make db-reset
      # 含 ArchUnit + @Tag("it") 集成测试；集成测试串行（同库互斥）
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            artifacts/*.log
            backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    needs: test
    runs-on: [self-hosted, linux, x64, rf-lab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            backend/target/*.jar
            frontend/dist/
          if-no-files-found: error
          retention-days: 14
