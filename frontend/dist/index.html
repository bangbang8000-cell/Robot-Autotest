<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIDC AutoTest</title>
    <script>
      /*
       * 首帧防闪（FR-v0.2-31 / NFR-v0.2-07）。
       *
       * 这段必须内联在 <head> 里同步执行，不能挪进 main.ts：Vue 挂载是异步的，
       * 等它跑完再设 data-theme，暗色用户会先看到一帧白屏（反之亮色用户先看到一帧黑屏）。
       * 逻辑与 composables/useTheme.ts 的 readStoredMode/resolve 保持一致，改一处要改两处。
       */
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          // 存储被禁用等异常：给暗色（历史默认），保证至少有主题，不至于无样式
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-B3gWZkp3.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CMtex9wz.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
